<!doctype html>
<meta charset="utf-8">
<title>learntmux banner</title>
<style>
  /* Brand guide §04 — Instrument Sans for the human voice, JetBrains Mono for
     everything the machine says, including the wordmark. */
  @font-face {
    font-family: 'Instrument Sans';
    src: url('instrument-sans.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('jetbrains-mono.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }

  :root {
    --void: #0a0b0e;      /* page ground, terminal body */
    --surface: #0f1114;
    --phosphor: #3ddc84;  /* progress and live state only */
    --ink: #e6e9ee;
    --muted: #8b93a1;
    --dim: #77808f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 420px; }

  body {
    background: var(--void);
    font-family: 'Instrument Sans', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }


  .card {
    width: 100%;
    height: 100%;
    padding: 48px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 30px;
    overflow: hidden;
  }

  /* §02 — the mark is a split pane: one tall, two stacked. Three rectangles. */
  .lockup { display: flex; align-items: center; gap: 15px; }
  .mark {
    display: grid;
    grid-template-columns: 13px 13px;
    grid-template-rows: 13px 13px;
    gap: 3px;
    flex: none;
  }
  .mark i { background: var(--phosphor); border-radius: 2px; }
  .mark i:nth-child(1) { grid-row: 1 / 3; }
  .mark i:nth-child(2) { opacity: 0.6; }
  .mark i:nth-child(3) { opacity: 0.3; }

  .wordmark {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .wordmark .learn { color: var(--muted); }
  .wordmark .dev { color: var(--phosphor); }

  /* §04 — display type is the human voice: Instrument Sans, 600, -0.02em. */
  .claim {
    font-size: 60px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.1;
    text-wrap: balance;
  }
  .claim .quiet { color: var(--muted); }

  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }

  /* §05 — the green status line. The one place green fills a whole surface,
     and the guide asks for it in every hero. */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    align-self: flex-start;
    background: var(--phosphor);
    color: var(--void);
    border-radius: 4px;
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    line-height: 1;
  }
  .status .session { font-weight: 600; }
  .status .current { background: var(--void); color: var(--phosphor); padding: 2px 7px; }

</style>

<div class="card">
  <div class="lockup">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="wordmark"><span class="learn">learn</span>tmux<span class="dev">.dev</span></span>
  </div>

  <h1 class="claim">42 tasks. One real terminal.<br><span class="quiet">tmux, in minutes.</span></h1>

  <div class="foot">
    <span class="status">
      <span class="session">[learn]</span>
      <span class="current">0:shell*</span>
      <span>1:server-</span>
    </span>
  </div>
</div>
